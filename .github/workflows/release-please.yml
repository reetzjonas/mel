name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Opens/updates a release PR that bumps package.json and CHANGELOG.md
      # from Conventional Commits; merging it creates the git tag + GitHub
      # Release that ci.yml's `publish` job (v*-tag trigger) picks up.
      # v5 is the first release that runs on node24; v4 runs on node20, which
      # GitHub now annotates every run with as deprecated.
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
