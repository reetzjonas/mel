name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  check:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      # build is also the typecheck: it runs vite build (which generates
      # routeTree.gen.ts) and only then tsc, and that order matters.
      - run: npm run build
      # Coverage, not a bare test run: the per-area thresholds in
      # vitest.config.ts are only a guard if something enforces them.
      - run: npm run test:coverage

  e2e:
    name: End-to-end against the built image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # The specs drive a real JMAP server. seed.sh provisions Stalwart from
      # nothing and is idempotent, so it doubles as the CI fixture.
      - name: Provision Stalwart
        run: npm run stalwart:seed

      # Test the artifact that gets published, not a dev server: the production
      # build registers a service worker and serves through nginx, and neither
      # of those is exercised by `vite dev`.
      - name: Build image
        run: docker build -t mel:ci .
      - name: Serve it
        run: |
          docker run -d --name mel-ci -p 8081:8080 mel:ci
          timeout 60 sh -c 'until curl -sf http://localhost:8081/index.html >/dev/null; do sleep 1; done'

      - run: npx playwright install --with-deps chromium
      - name: Run Playwright
        env:
          MEL_E2E_BASE_URL: http://localhost:8081
        run: npm run test:e2e

      - name: Container logs on failure
        if: failure()
        run: docker logs mel-ci
      # Both, and neither is optional: the report is the readable summary, and
      # test-results/ carries the traces it links to. Uploading only the report
      # leaves every "why did that fail" unanswerable.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  publish:
    name: Push to ghcr
    needs: [check, e2e]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The e2e job already built these layers; reuse them rather than
          # compiling the bundle a second time.
          cache-from: type=gha
          cache-to: type=gha,mode=max
