# nginx replaces, rather than merges, add_header sets: a location that defines
# any add_header of its own loses every inherited one. So these are pulled into
# each block instead of being declared once at server level.
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
add_header X-Frame-Options DENY always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
