server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    # mel connects to whichever JMAP server the user signs in to, so the app's
    # own headers cannot narrow that down. What they can do is lock down where
    # this app itself is allowed to come from.
    include /etc/nginx/mel-headers.conf;

    # Hashed filenames: safe to keep forever.
    location /assets/ {
        include /etc/nginx/mel-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The service worker decides when users get a new build. Cache it and they
    # keep the old one until the entry expires, which is exactly what makes a
    # PWA feel impossible to update.
    location = /sw.js {
        include /etc/nginx/mel-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        include /etc/nginx/mel-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/mel-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Client-side routing: /mail/<id>/<id> is not a file on disk.
    location / {
        include /etc/nginx/mel-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
