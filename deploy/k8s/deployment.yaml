# mel serves a static bundle and keeps no server-side state: the browser talks
# to the JMAP server directly and everything lives in IndexedDB on the device.
# That makes the workload trivially horizontally scalable and lets the whole
# filesystem be read-only.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mel
  labels:
    app.kubernetes.io/name: mel
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: mel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mel
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mel
          image: ghcr.io/reetzjonas/mel:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          # nginx wants somewhere to write even when it is only serving files.
          volumeMounts:
            - { name: cache, mountPath: /var/cache/nginx }
            - { name: run, mountPath: /var/run }
            - { name: tmp, mountPath: /tmp }
          readinessProbe:
            httpGet: { path: /index.html, port: http }
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /index.html, port: http }
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
      volumes:
        - { name: cache, emptyDir: {} }
        - { name: run, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: mel
  labels:
    app.kubernetes.io/name: mel
spec:
  selector:
    app.kubernetes.io/name: mel
  ports:
    - name: http
      port: 80
      targetPort: http
